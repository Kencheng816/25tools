<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>25節生成工具</title>
  <link rel="stylesheet" href="launcher/launcher.css" />
</head>
<body>
  <main class="launcher">
    <header class="launcher-hero">
      <h1>25節生成工具</h1>
      <p>選擇要製作的版位</p>
    </header>

    <!-- 卡片由 config/tools.js 資料驅動產生（launcher/launcher.js），HTML 不寫死。 -->
    <div id="toolGroups" class="launcher-groups" aria-label="工具清單"></div>
    <p id="launcherError" class="launcher-error" role="alert" hidden></p>
  </main>

  <script src="config/tools.js"></script>
  <script src="launcher/launcher.js"></script>
  <script src="core/sw-register.js"></script>
</body>
</html>
